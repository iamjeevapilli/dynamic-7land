name: Publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json
        required: true
        default: v1.3.0
concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package.json version.' }
          $remoteTags = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
          if ($remoteTags.Count -gt 0) {
            $peeled = @($remoteTags | Where-Object { $_ -like '*^{}' })
            $tagCommit = (($peeled + $remoteTags)[0] -split '\s+')[0]
            if ($tagCommit -ne $env:GITHUB_SHA) { throw 'The release tag points to a different commit. Run from that tag or choose a new version.' }
          }
      - run: npm.cmd ci --include=optional
      - run: npm.cmd test
      - run: npm.cmd run check:syntax
      - name: Check Windows setup script
        shell: powershell
        run: .\tools\check-powershell.ps1
      - run: npm.cmd run build:windows
      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Dynamic7land -DestinationPath Dynamic7land-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash Dynamic7land-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Dynamic7land-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" Dynamic7land-Windows-x64.zip SHA256SUMS.txt --clobber
          } else {
            gh release create "$env:RELEASE_TAG" Dynamic7land-Windows-x64.zip SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Dynamic 7land $env:RELEASE_TAG" --notes-file RELEASE-NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
