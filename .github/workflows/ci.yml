name: Verify Dynamic 7land
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm.cmd ci --include=optional
      - run: npm.cmd test
      - run: npm.cmd run check:syntax
      - name: Check Windows setup script
        shell: powershell
        run: .\tools\check-powershell.ps1
      - run: npm.cmd run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Dynamic7land-Windows-x64
          path: dist/Dynamic7land
          retention-days: 7
